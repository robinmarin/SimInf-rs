[workspace]
resolver = "2"
members = ["siminf-core", "siminf-wasm", "siminf-py"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0"

[workspace.dependencies]
rand = "0.8"
rand_distr = "0.6"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true